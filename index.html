<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unique Claims JA | Temporarily Paused</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0c4a6e 100%);
    font-family: 'Outfit', system-ui, sans-serif;
    color: white;
    text-align: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 520px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .logo {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, #0284c7, #7c3aed);
    border-radius: 18px;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 28px;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 12px;
    letter-spacing: -0.02em;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #cbd5e1;
    margin-bottom: 8px;
  }
  .highlight {
    color: #fed100;
    font-weight: 700;
  }
  .contact {
    margin-top: 28px;
    font-size: 15px;
  }
  a {
    color: #22d3ee;
    text-decoration: none;
    font-weight: 600;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">UC</div>
    <h1>Unique Claims JA</h1>
    <p>Our store is <span class="highlight">temporarily paused</span> while we make some updates.</p>
    <p>We’ll be back shortly with the full shopping experience.</p>
    <div class="contact">
      Need something in the meantime?<br>
      Message us on WhatsApp:<br>
      <a href="https://wa.me/18765550199" target="_blank">+1 876 555 0199</a>
    </div>
  </div>
</body>
</html>
