<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unique Claims admin</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{--ink:#241833;--muted:#6f647e;--line:#f0e3d8;--pink:#ff4f9a}
*{box-sizing:border-box} body{margin:0;font-family:Outfit,system-ui,sans-serif;background:#fff6ef;color:var(--ink)}
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 16px 40px rgba(70,30,70,.08);margin-bottom:12px}
input,textarea,select{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);margin:4px 0 10px;font:inherit}
label{font-weight:700;font-size:13px}
.btn{border:0;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#ff4f9a,#ff7a59);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.wa{background:#18b56a}
.btn.danger{background:#ffe4ea;color:#b4234a}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{padding:16px;background:#fff;border-right:1px solid var(--line)}
aside button{display:block;width:100%;text-align:left;margin:6px 0;background:#fff6ef;border:0;border-radius:12px;padding:10px;font-weight:800;cursor:pointer}
aside button.on{background:var(--ink);color:#fff}
main{padding:16px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{width:120px;background:#fff6ef;border-radius:12px;padding:6px;margin:0}
.photos img{width:100%;height:80px;object-fit:cover;border-radius:8px}
.note{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:800px){.app{grid-template-columns:1fr} aside{border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="card" style="width:min(420px,100%);text-align:center">
    <img src="logo.png" alt="Unique Claims" style="height:90px;margin:0 auto 8px">
    <h1>Shop admin</h1>
    <p class="note">Edit products, photos, prices, stock and bundles. Publish sends the shop live on uniqueclaimsja.store.</p>
    <label>PIN</label>
    <input id="pin" type="password" placeholder="Default PIN is 19500">
    <button class="btn" onclick="login()">Open panel</button>
  </div>
</div>
<div class="app" id="app" style="display:none">
  <aside>
    <img src="logo.png" alt="" style="height:64px">
    <button class="on" onclick="tab('products',this)">Products</button>
    <button onclick="tab('edit',this)">Edit item</button>
    <button onclick="tab('bundles',this)">Bundles</button>
    <button onclick="tab('pages',this)">Reviews & FAQ</button>
    <button onclick="tab('settings',this)">Settings & publish</button>
    <p class="note">Drafts stay on this device until you publish.</p>
    <a href="index.html">View shop</a>
    <button class="btn alt" onclick="logout()">Lock</button>
  </aside>
  <main id="main"></main>
</div>
<script>
const KEY="uc_draft";
let data={}, editing=0;
const money=n=>"J$"+(Number(n)||0).toLocaleString("en-JM");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&","<":"<",">":">",'"':""","'":"&#39;"}[c]));
function pin(){return localStorage.getItem("uc_pin")||"19500"}
function login(){if(document.getElementById("pin").value!==pin()) return alert("Wrong PIN. Default is 19500 until you change it.");sessionStorage.setItem("uc_ok","1");start()}
function logout(){sessionStorage.removeItem("uc_ok");location.reload()}
async function start(){
  document.getElementById("gate").style.display="none";
  document.getElementById("app").style.display="grid";
  const draft=localStorage.getItem(KEY);
  if(draft) data=JSON.parse(draft);
  else data=await (await fetch("catalog.json?v="+Date.now(),{cache:"no-store"})).json();
  data.products=data.products||[]; data.bundles=data.bundles||[]; data.reviews=data.reviews||[]; data.faqs=data.faqs||[]; data.categories=data.categories||[];
  tab("products", document.querySelector("aside button"));
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function tab(name,btn){
  document.querySelectorAll("aside button").forEach(b=>b.classList.remove("on"));
  if(btn) btn.classList.add("on");
  if(name==="products") renderProducts();
  if(name==="edit") renderEdit();
  if(name==="bundles") renderBundles();
  if(name==="pages") renderPages();
  if(name==="settings") renderSettings();
}
function renderProducts(){
  document.getElementById("main").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Products</h2><button class="btn" onclick="newProduct()">New product</button></div><p class="note">Unlimited photos per product. Reorder, delete, then Publish live.</p></div>`+
  data.products.map((p,i)=>`<div class="card" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div><b>${esc(p.name)}</b><div class="note">${esc(p.category)} · ${money(p.price)} · ${esc(p.availability)} · ${(p.images||[]).length} photos</div></div><div class="row"><button class="btn alt" onclick="editAt(${i})">Edit</button><button class="btn danger" onclick="delProduct(${i})">Delete</button></div></div>`).join("");
}
function newProduct(){
  data.products.unshift({id:"item-"+Date.now(),name:"New product",price:0,compareAt:0,category:data.categories[0]||"Projectors",availability:"instock",stock:1,badge:"New",blurb:"",description:"",features:[],specs:[],images:[],addonIds:[]});
  save(); editing=0; tab("edit");
}
function editAt(i){editing=i;tab("edit")}
function delProduct(i){if(!confirm("Delete this product?"))return;data.products.splice(i,1);save();renderProducts()}
function renderEdit(){
  if(editing==null||!data.products[editing]) editing=0;
  const p=data.products[editing]; if(!p) return renderProducts();
  document.getElementById("main").innerHTML=`<div class="card"><h2>Edit product</h2>
  <label>Name</label><input id="f-name" value="${esc(p.name)}">
  <div class="row"><div style="flex:1"><label>Price J$</label><input id="f-price" type="number" value="${p.price||0}"></div>
  <div style="flex:1"><label>Compare-at J$</label><input id="f-compare" type="number" value="${p.compareAt||0}"></div></div>
  <div class="row"><div style="flex:1"><label>Category</label><input id="f-cat" value="${esc(p.category)}" list="cats"><datalist id="cats">${data.categories.map(c=>`<option>${esc(c)}</option>`).join("")}</datalist></div>
  <div style="flex:1"><label>Availability</label><select id="f-av"><option ${p.availability==="instock"?"selected":""} value="instock">In stock</option><option ${p.availability==="preorder"?"selected":""} value="preorder">Pre-order</option><option ${p.availability==="low"?"selected":""} value="low">Low stock</option><option ${p.availability==="out"?"selected":""} value="out">Sold out</option></select></div>
  <div style="flex:1"><label>Stock count</label><input id="f-stock" type="number" value="${p.stock||0}"></div></div>
  <label>Badge</label><input id="f-badge" value="${esc(p.badge||"")}">
  <label>Short line</label><input id="f-blurb" value="${esc(p.blurb||"")}">
  <label>Full description</label><textarea id="f-desc" rows="4">${esc(p.description||"")}</textarea>
  <label>Features, one per line</label><textarea id="f-feat" rows="4">${esc((p.features||[]).join("\n"))}</textarea>
  <label>Specs as Label: Value, one per line</label><textarea id="f-specs" rows="4">${esc((p.specs||[]).map(s=>s.k+": "+s.v).join("\n"))}</textarea>
  <label>Add-on product ids, comma separated</label><input id="f-addons" value="${esc((p.addonIds||[]).join(", "))}">
  <h3>Photos</h3><p class="note">Upload as many as you want. First photo is the cover. Use arrows to reorder.</p>
  <div class="photos" id="photos">${(p.images||[]).map((src,i)=>`<figure><img src="${src}"><div class="row"><button class="btn alt" onclick="movePhoto(${i},-1)">↑</button><button class="btn alt" onclick="movePhoto(${i},1)">↓</button><button class="btn danger" onclick="delPhoto(${i})">Del</button></div></figure>`).join("")}</div>
  <label>Upload photos</label><input type="file" accept="image/*" multiple onchange="addPhotos(this)">
  <label>Or paste an image URL</label><div class="row"><input id="f-url" placeholder="https://..."><button class="btn alt" onclick="addUrl()">Add URL</button></div>
  <button class="btn" onclick="saveProduct()">Save product draft</button></div>`;
}
function movePhoto(i,d){const p=data.products[editing]; const j=i+d; if(j<0||j>=p.images.length) return; [p.images[i],p.images[j]]=[p.images[j],p.images[i]]; save(); renderEdit()}
function delPhoto(i){data.products[editing].images.splice(i,1); save(); renderEdit()}
function addUrl(){const u=document.getElementById("f-url").value.trim(); if(!u) return; data.products[editing].images.push(u); save(); renderEdit()}
function addPhotos(input){
  const files=[...input.files];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        const scale=Math.min(1,1400/Math.max(img.width,img.height));
        canvas.width=Math.round(img.width*scale); canvas.height=Math.round(img.height*scale);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        data.products[editing].images.push(canvas.toDataURL("image/jpeg",0.72));
        save(); renderEdit();
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function saveProduct(){
  const p=data.products[editing];
  p.name=document.getElementById("f-name").value.trim();
  p.price=Number(document.getElementById("f-price").value)||0;
  p.compareAt=Number(document.getElementById("f-compare").value)||0;
  p.category=document.getElementById("f-cat").value.trim()||"Projectors";
  if(!data.categories.includes(p.category)) data.categories.push(p.category);
  p.availability=document.getElementById("f-av").value;
  p.stock=Number(document.getElementById("f-stock").value)||0;
  p.badge=document.getElementById("f-badge").value.trim();
  p.blurb=document.getElementById("f-blurb").value.trim();
  p.description=document.getElementById("f-desc").value.trim();
  p.features=document.getElementById("f-feat").value.split("\n").map(s=>s.trim()).filter(Boolean);
  p.specs=document.getElementById("f-specs").value.split("\n").map(s=>s.trim()).filter(Boolean).map(line=>{const [k,...rest]=line.split(":"); return {k:k.trim(),v:rest.join(":").trim()}});
  p.addonIds=document.getElementById("f-addons").value.split(",").map(s=>s.trim()).filter(Boolean);
  save(); alert("Draft saved on this device. Publish live when you want customers to see it.");
}
function renderBundles(){
  document.getElementById("main").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Bundles</h2><button class="btn" onclick="newBundle()">New bundle</button></div><p class="note">Discount is taken off the sum of the product prices.</p></div>`+
  data.bundles.map((b,i)=>`<div class="card"><label>Name</label><input value="${esc(b.name)}" onchange="data.bundles[${i}].name=this.value;save()">
  <label>Short line</label><input value="${esc(b.blurb||"")}" onchange="data.bundles[${i}].blurb=this.value;save()">
  <label>Badge</label><input value="${esc(b.badge||"")}" onchange="data.bundles[${i}].badge=this.value;save()">
  <label>Product ids, comma separated</label><input value="${esc((b.productIds||[]).join(", "))}" onchange="data.bundles[${i}].productIds=this.value.split(',').map(s=>s.trim()).filter(Boolean);save()">
  <label>Discount J$</label><input type="number" value="${b.discount||0}" onchange="data.bundles[${i}].discount=Number(this.value)||0;save()">
  <button class="btn danger" onclick="data.bundles.splice(${i},1);save();renderBundles()">Delete bundle</button></div>`).join("");
}
function newBundle(){data.bundles.push({id:"bundle-"+Date.now(),name:"New bundle",blurb:"",productIds:[],discount:500,badge:"Save"});save();renderBundles()}
function renderPages(){
  document.getElementById("main").innerHTML=`<div class="card"><h2>Reviews</h2>${data.reviews.map((r,i)=>`<div class="card"><input value="${esc(r.name)}" onchange="data.reviews[${i}].name=this.value;save()"><textarea onchange="data.reviews[${i}].text=this.value;save()">${esc(r.text)}</textarea><button class="btn danger" onclick="data.reviews.splice(${i},1);save();renderPages()">Delete</button></div>`).join("")}<button class="btn" onclick="data.reviews.push({name:'Customer',text:'',stars:5});save();renderPages()">Add review</button></div>
  <div class="card"><h2>FAQ</h2>${data.faqs.map((f,i)=>`<div class="card"><input value="${esc(f.q)}" onchange="data.faqs[${i}].q=this.value;save()"><textarea onchange="data.faqs[${i}].a=this.value;save()">${esc(f.a)}</textarea><button class="btn danger" onclick="data.faqs.splice(${i},1);save();renderPages()">Delete</button></div>`).join("")}<button class="btn" onclick="data.faqs.push({q:'New question',a:''});save();renderPages()">Add FAQ</button></div>`;
}
function renderSettings(){
  const s=data.settings||{};
  const g=JSON.parse(localStorage.getItem("uc_github")||"{}");
  document.getElementById("main").innerHTML=`<div class="card"><h2>Shop text</h2>
  ${[["name","Shop name"],["tagline","Tagline"],["announcement","Announcement bar"],["heroTitle","Hero title"],["heroText","Hero text"],["deliveryNote","Delivery note"],["hours","Hours"],["location","Location"],["whatsapp","WhatsApp number"],["email","Email"],["instagram","Instagram"],["tiktok","TikTok"],["facebook","Facebook"]].map(([k,lab])=>`<label>${lab}</label>${k==="heroText"||k==="deliveryNote"?`<textarea id="s-${k}">${esc(s[k]||"")}</textarea>`:`<input id="s-${k}" value="${esc(s[k]||"")}">`}`).join("")}
  <label>New admin PIN</label><input id="set-pin" placeholder="Leave blank to keep current">
  <button class="btn" onclick="saveSettings()">Save settings draft</button></div>
  <div class="card"><h2>Publish to GitHub</h2>
  <p class="note">Paste a GitHub token with repo access once, then Publish live. Photos upload as files. Customers see the new shop after GitHub Pages refreshes, usually under a minute. Token stays only in this browser.</p>
  <label>Token</label><input id="gh-token" type="password" value="${esc(g.token||"")}" placeholder="github_pat_...">
  <label>Owner</label><input id="gh-owner" value="${esc(g.owner||"HumbleKidd")}">
  <label>Repo</label><input id="gh-repo" value="${esc(g.repo||"Unique-Claims-JA")}">
  <label>Branch</label><input id="gh-branch" value="${esc(g.branch||"main")}">
  <div class="row"><button class="btn wa" onclick="publish()">Publish live</button><button class="btn alt" onclick="exportBackup()">Download backup</button></div>
  <label>Import backup</label><input type="file" accept="application/json" onchange="importBackup(this)"></div>`;
}
function saveSettings(){
  data.settings=data.settings||{};
  ["name","tagline","announcement","heroTitle","heroText","deliveryNote","hours","location","whatsapp","email","instagram","tiktok","facebook"].forEach(k=>{data.settings[k]=document.getElementById("s-"+k).value.trim()});
  if(document.getElementById("set-pin").value) localStorage.setItem("uc_pin",document.getElementById("set-pin").value);
  save(); alert("Settings draft saved.");
}
function exportBackup(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="unique-claims-catalog.json";a.click()}
function importBackup(input){const file=input.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=()=>{data=JSON.parse(reader.result);save();alert("Backup imported as draft.");tab("products")}; reader.readAsText(file)}
function ghConf(){
  const g={token:document.getElementById("gh-token")?document.getElementById("gh-token").value:(JSON.parse(localStorage.getItem("uc_github")||"{}").token),owner:document.getElementById("gh-owner")?document.getElementById("gh-owner").value:"HumbleKidd",repo:document.getElementById("gh-repo")?document.getElementById("gh-repo").value:"Unique-Claims-JA",branch:document.getElementById("gh-branch")?document.getElementById("gh-branch").value:"main"};
  localStorage.setItem("uc_github",JSON.stringify(g));
  return g;
}
async function gh(path,method,body){
  const g=ghConf();
  const res=await fetch(`https://api.github.com/repos/${g.owner}/${g.repo}/contents/${path}`,{method,headers:{Authorization:"Bearer "+g.token,Accept:"application/vnd.github+json"},body:body?JSON.stringify(body):undefined});
  const json=await res.json().catch(()=>({}));
  if(!res.ok && res.status!==404) throw new Error(json.message||"GitHub error");
  return {status:res.status,json};
}
async function putFile(path,contentB64,message){
  const g=ghConf();
  let sha; try{const cur=await gh(path,"GET"); sha=cur.json.sha}catch(e){}
  const body={message,content:contentB64,branch:g.branch}; if(sha) body.sha=sha;
  const res=await gh(path,"PUT",body);
  if(res.status>=300) throw new Error(res.json.message||"Upload failed");
}
async function publish(){
  const g=ghConf();
  if(!g.token){tab("settings");return alert("Paste your GitHub token in Settings first.")}
  if(!confirm("Publish this draft to the live site?")) return;
  const copy=JSON.parse(JSON.stringify(data));
  let n=0;
  for(const p of copy.products){
    p.images=await Promise.all((p.images||[]).map(async src=>{
      if(!String(src).startsWith("data:")) return src;
      n++; const b64=src.split(",")[1]; const path=`media/${p.id}-${n}.jpg`;
      await putFile(path,b64,`Add photo ${path}`); return path;
    }));
  }
  const json=btoa(unescape(encodeURIComponent(JSON.stringify(copy,null,2))));
  await putFile("catalog.json",json,"Update Unique Claims catalog");
  localStorage.setItem(KEY,JSON.stringify(copy)); data=copy;
  alert("Published. Give GitHub Pages a minute, then refresh uniqueclaimsja.store.");
}
if(sessionStorage.getItem("uc_ok")==="1") start();
</script>
</body>
</html>
