<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Unique Claims</title>
<style>
body { font-family: system-ui; background:#111; color:#eee; padding:20px; }
.card { background:#1a1a1a; padding:16px; margin:12px 0; border-radius:12px; }
input, textarea { width:100%; padding:8px; margin:6px 0; background:#222; color:#fff; border:1px solid #333; border-radius:6px; }
button { background:#6366f1; color:white; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<h1>Unique Claims Admin</h1>
<p>Edit products below. For live Firebase sync, paste your config in the console or contact for full integration. Changes here update local preview; push updated products.json for live site.</p>
<div id="editor"></div>
<button onclick="save()">Download Updated products.json</button>
<script>
let data = {};
async function init() {
  const res = await fetch('products.json');
  data = await res.json();
  render();
}
function render() {
  document.getElementById('editor').innerHTML = data.products.map((p, i) => `
    <div class="card">
      <strong>${p.name}</strong>
      <input value="${p.price}" onchange="data.products[${i}].price = +this.value" placeholder="Price">
      <textarea onchange="data.products[${i}].blurb = this.value">${p.blurb}</textarea>
      <textarea onchange="data.products[${i}].description = this.value">${p.description}</textarea>
    </div>
  `).join('');
}
function save() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'products.json';
  a.click();
  alert('Download products.json and replace the file in the repo for live updates. Full drag-drop Shopify-style editor + Firebase media uploads can be added next.');
}
init();
</script>
</body>
</html>
