<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | Unique Claims</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>😉</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg:#0a0a0f; --card:#16161d; --text:#f5f5f7; --muted:#a1a1aa; --accent:#6366f1; --accent2:#22d3ee; --border:rgba(255,255,255,0.08); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Inter',system-ui,sans-serif; background:var(--bg); color:var(--text); }
header { padding:16px 5%; background:rgba(10,10,15,0.9); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); display:flex; align-items:center; }
.logo { height:40px; margin-right:auto; }
.container { max-width:1200px; margin:40px auto; padding:0 5%; display:grid; grid-template-columns:1fr 1fr; gap:40px; }
.gallery img { width:100%; border-radius:16px; margin-bottom:12px; cursor:pointer; }
.main-img { width:100%; height:480px; object-fit:cover; border-radius:20px; }
h1 { font-size:2.2rem; margin-bottom:12px; }
.price { font-size:2rem; font-weight:700; color:var(--accent2); margin:16px 0; }
.desc { color:var(--muted); margin:20px 0; line-height:1.7; }
.features { list-style:none; margin:20px 0; }
.features li { padding:8px 0; border-bottom:1px solid var(--border); }
.btn { background:var(--accent); color:white; padding:14px 28px; border:none; border-radius:12px; font-weight:600; cursor:pointer; font-size:1rem; }
@media(max-width:768px) { .container { grid-template-columns:1fr; } .main-img { height:300px; } }
</style>
</head>
<body>
<header>
  <a href="index.html"><img src="https://raw.githubusercontent.com/HumbleKidd/Unique-Claims-JA/main/logo.png" class="logo" alt="Logo"></a>
</header>
<div class="container" id="content">
  <p>Loading product...</p>
</div>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
async function load() {
  const res = await fetch('products.json');
  const data = await res.json();
  const p = data.products.find(x => x.id === id);
  if (!p) { document.getElementById('content').innerHTML = '<p>Product not found.</p>'; return; }
  document.title = p.name + ' | Unique Claims';
  const thumbs = p.images.map(img => `<img src="${img}" onclick="document.querySelector('.main-img').src=this.src">`).join('');
  document.getElementById('content').innerHTML = `
    <div class="gallery">
      <img class="main-img" src="${p.images[0] || ''}" alt="${p.name}">
      <div style="display:flex;gap:8px;overflow-x:auto;">${thumbs}</div>
    </div>
    <div>
      <h1>${p.name}</h1>
      <div class="price">$${p.price.toLocaleString()}</div>
      <p class="desc">${p.description}</p>
      <ul class="features">${(p.features||[]).map(f => `<li>✓ ${f}</li>`).join('')}</ul>
      <button class="btn" onclick="addAndGo()">Add to Bundle</button>
      <p style="margin-top:16px;color:var(--muted);">Adding this to a bundle helps reduce shipping costs when ordering multiple items.</p>
    </div>
  `;
  window.currentProduct = p;
}
function addAndGo() {
  let cart = JSON.parse(localStorage.getItem('uc_cart') || '[]');
  const existing = cart.find(i => i.id === window.currentProduct.id);
  if (existing) existing.qty++; else cart.push({...window.currentProduct, qty:1});
  localStorage.setItem('uc_cart', JSON.stringify(cart));
  location.href = 'index.html';
}
load();
</script>
</body>
</html>
